<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar Mitra - Bandar Flores</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#f0f4f8;padding:20px} .card{background:white;padding:20px;border-radius:16px;max-width:400px;margin:auto} input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-bottom:10px;box-sizing:border-box} button{background:#0a7cff;color:white;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold}</style></head><body>
<div class="card"><h2>🚀 Daftar Jadi Mitra</h2><p>Warung Online Bandar Flores Nagekeo</p><input id="nama" placeholder="Nama Toko Misal: Kios Berkat"><input id="hp" placeholder="No HP 0821..."><input id="pass" type="password" placeholder="Password"><button onclick="daftar()">DAFTAR SEKARANG</button><br><br><center><a href="mitra.html">Sudah punya akun? Masuk</a></center><div id="msg"></div></div>
<script>
const SUPABASE_URL="https://YOUR_PROJECT.supabase.co"; const SUPABASE_KEY="YOUR_ANON_KEY";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function daftar(){let nama=document.getElementById('nama').value,hp=document.getElementById('hp').value,pass=document.getElementById('pass').value;if(!nama||!hp||!pass)return alert('Lengkapi!');document.getElementById('msg').innerText='Proses...';let{data,error}=await supabase.from('mitra').insert([{nama_toko:nama,no_hp:hp,password:pass,saldo:0}]).select();if(error)document.getElementById('msg').innerText='Gagal: '+error.message+(error.message.includes('duplicate')?' No HP sudah terdaftar':'' );else{document.getElementById('msg').innerHTML='<b style="color:green">SUKSES! Saldo 0, hubungi BOS buat isi saldo. <a href=mitra.html>Masuk sekarang</a></b>';}}
</script></body></html>
