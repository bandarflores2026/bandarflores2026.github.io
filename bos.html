   <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOS PANEL - RAHASIA</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;background:#0f1115;color:white;padding:12px}.card{background:#1c1f2a;padding:15px;border-radius:16px;margin-bottom:12px}button{background:#0a7cff;color:white;border:0;padding:10px;border-radius:8px}input{padding:10px;border-radius:8px;border:0;width:100%;box-sizing:border-box;margin-bottom:8px}</style></head><body>
<script>if(prompt('Password BOS:')!=='bos123')location.href='/';</script>
<h2>💰 PANEL BOS - RAHASIA</h2>
<div class="card"><h3>Untung Hari Ini</h3><h1 id="untungHari">Rp 0</h1><small id="omsetHari"></small></div>
<div class="card"><h3>Tambah Saldo Mitra</h3><input id="mid" placeholder="ID / No HP Mitra"><input id="jml" type="number" placeholder="Jumlah 200000"><button onclick="tambahSaldo()">+ TAMBAH SALDO</button></div>
<div class="card"><h3>Daftar Mitra</h3><div id="listMitra">Loading...</div></div>
<div class="card"><h3>Transaksi Terakhir</h3><div id="listTrx">Loading...</div></div>
<script>
const SUPABASE_URL="https://YOUR_PROJECT.supabase.co";
const SUPABASE_KEY="YOUR_ANON_KEY";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){let{data:mitra}=await supabase.from('mitra').select('*').order('created_at',{ascending:false});document.getElementById('listMitra').innerHTML=mitra.map(m=>`<div style="border-bottom:1px solid #333;padding:8px 0"><b>${m.nama_toko}</b> - ${m.no_hp}<br>Saldo: <b style="color:${m.saldo<20000?'#ff4444':'#4caf50'}">Rp ${m.saldo.toLocaleString('id-ID')}</b> ${m.saldo<20000?'⚠️':''}<br><small>${m.id}</small></div>`).join('');let today=new Date().toISOString().slice(0,10);let{data:trx}=await supabase.from('transaksi').select('*,mitra(nama_toko)').gte('created_at',today).order('created_at',{ascending:false}).limit(50);let untung=0,omset=0;trx.forEach(t=>{untung+=t.untung||0;omset+=t.harga_jual||0;});document.getElementById('untungHari').innerText='Rp '+untung.toLocaleString('id-ID');document.getElementById('omsetHari').innerText='Omset: Rp '+omset.toLocaleString('id-ID')+' dari '+trx.length+' trx';let{data:alltrx}=await supabase.from('transaksi').select('*,mitra(nama_toko)').order('created_at',{ascending:false}).limit(20);document.getElementById('listTrx').innerHTML=alltrx.map(t=>`${t.created_at.slice(11,16)} - ${t.mitra?.nama_toko} - ${t.produk} - Modal ${t.harga_modal} Jual ${t.harga_jual} <b style="color:#4caf50">+${t.untung}</b><br>`).join('');}
async function tambahSaldo(){let id=document.getElementById('mid').value,jml=parseInt(document.getElementById('jml').value);if(!id||!jml)return alert('Isi lengkap');let{data:m}=await supabase.from('mitra').select('*').or(`id.eq.${id},no_hp.eq.${id}`).single();if(!m)return alert('Mitra tidak ketemu');let{error}=await supabase.from('mitra').update({saldo:m.saldo+jml}).eq('id',m.id);if(error)alert(error.message);else{alert('Sukses +Rp '+jml);load();}}load();setInterval(load,10000);
</script></body></html>
