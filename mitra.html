<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandar Pulsa Flores</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:system-ui;padding:12px;background:#f0f4f8;margin:0}.card{background:white;padding:15px;border-radius:16px;margin-bottom:12px;box-shadow:0 2px 8px #0001}.saldo{font-size:28px;font-weight:900;color:#0a7cff}button{background:#0a7cff;color:white;border:0;padding:12px;border-radius:10px;width:100%;font-weight:bold}input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;box-sizing:border-box}.tab{display:inline-block;padding:8px 14px;background:#e8eef5;border-radius:20px;margin:3px;font-size:13px;cursor:pointer}.tab.active{background:#0a7cff;color:white}</style></head><body>
<div class="card"><div id="loginBox"><h3>Masuk Mitra</h3><input id="hp" placeholder="No HP 0821..."><br><br><input id="pass" type="password" placeholder="Password"><br><br><button onclick="login()">MASUK</button></div><div id="mainBox" style="display:none">Saldo:<div class="saldo" id="saldo">Rp 0</div><small id="namaToko"></small><br><br><button onclick="logout()" style="background:#eee;color:#333;padding:6px;width:auto">Logout</button></div></div>
<div class="card" id="trxBox" style="display:none"><input id="tujuan" placeholder="Nomor Tujuan / ID PLN"><br><br><div><span class="tab active" onclick="filterCat('all',this)">Semua</span><span class="tab" onclick="filterCat('PULSA',this)">Pulsa</span><span class="tab" onclick="filterCat('DATA',this)">Data</span><span class="tab" onclick="filterCat('PLN',this)">PLN</span></div><br><div id="list">Loading...</div></div>
<script>
const SUPABASE_URL="https://YOUR_PROJECT.supabase.co";
const SUPABASE_KEY="YOUR_ANON_KEY";
const API="https://bandarflores2026.vercel.app/api";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let ALL_PRODUK=[],mitra=null;
async function login(){let hp=document.getElementById('hp').value,pass=document.getElementById('pass').value;let{data,error}=await supabase.from('mitra').select('*').eq('no_hp',hp).eq('password',pass).single();if(error||!data)return alert('Salah');localStorage.setItem('mitra_id',data.id);loadMitra();}
async function loadMitra(){let id=localStorage.getItem('mitra_id');if(!id)return;let{data}=await supabase.from('mitra').select('*').eq('id',id).single();if(!data)return;mitra=data;document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';document.getElementById('trxBox').style.display='block';document.getElementById('saldo').innerText='Rp '+data.saldo.toLocaleString('id-ID');document.getElementById('namaToko').innerText=data.nama_toko;loadHarga();}
function logout(){localStorage.clear();location.reload();}
async function loadHarga(){try{let r=await fetch(API);let j=await r.json();ALL_PRODUK=j.data||[];render(ALL_PRODUK);}catch(e){document.getElementById('list').innerHTML='API belum jalan';}}
function render(arr){document.getElementById('list').innerHTML=arr.slice(0,60).map(p=>`<div class="card" style="padding:10px"><b>${p.product_name}</b><br><small>${p.category}</small><br><b style="color:#0a7cff">Rp ${p.price_jual}</
